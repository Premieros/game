<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>BlastKart 3D — سباق الصواريخ</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="menu" class="panel">
    <div class="logo">BLAST<span>KART</span><small>3D</small></div>
    <p>سباق Kart ثلاثي الأبعاد — حتى 10 متسابقين، والـBots يملأوا الأماكن الفارغة تلقائيًا.</p>
    <input id="name" maxlength="16" placeholder="اسم اللاعب" value="Player" />
    <div class="row three">
      <button id="solo">🤖 فردي</button>
      <button id="quick" class="primary">🌐 Online</button>
      <button id="private">🎮 غرفة خاصة</button>
    </div>
    <div id="privateBox" class="private hidden">
      <input id="room" maxlength="8" placeholder="كود الغرفة" />
      <button id="joinRoom">دخول</button>
    </div>
    <div class="help">الكمبيوتر: الأسهم/WASD للحركة — Space للسلاح. الموبايل: الأزرار على الشاشة.</div>
  </div>

  <canvas id="game"></canvas>
  <div id="hud" class="hidden">
    <div class="hudTop">
      <div id="rank">1/10</div>
      <div id="lap">لفة 1/3</div>
      <div id="item">بدون سلاح</div>
      <div id="roomLabel"></div>
    </div>
    <div id="leaderboard"></div>
  </div>

  <div id="mobile" class="hidden">
    <div class="steer"><button data-key="left">◀</button><button data-key="right">▶</button></div>
    <div class="drive"><button data-key="brake">▼</button><button data-key="throttle">▲</button><button data-key="use" class="fire">🚀</button></div>
  </div>
  <div id="toast"></div>
  <script src="/game.js"></script>
</body>
</html>
